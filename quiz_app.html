<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>QuizMaster</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(ellipse at 30% 20%, #2d2d3f 0%, #1a1a2e 50%, #0f0f1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}
.container {
  width: 440px;
  max-width: 94vw;
  max-height: 92vh;
  padding: 28px 30px;
  border-radius: 28px;
  background: rgba(30, 30, 46, 0.72);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 1px 0 rgba(255, 255, 255, 0.05) inset;
  position: relative;
  overflow: hidden;
}
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; }
#welcomeScreen { min-height: 400px; }
#quizScreen { min-height: 420px; }
#resultsScreen { min-height: 400px; }
.welcome-header { text-align: center; margin-bottom: 24px; }
.welcome-header .logo { font-size: 48px; margin-bottom: 4px; }
.welcome-header h1 { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
.welcome-header p { font-size: 14px; color: rgba(255, 255, 255, 0.45); margin-top: 4px; }
.category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.cat-btn {
  border: none; outline: none; cursor: pointer; font-family: inherit;
  padding: 16px 12px; border-radius: 14px; background: rgba(55, 55, 75, 0.45);
  color: rgba(255, 255, 255, 0.8); text-align: center;
  transition: all 0.2s ease; position: relative; overflow: hidden;
}
.cat-btn:hover { background: rgba(75, 75, 100, 0.6); transform: translateY(-1px); }
.cat-btn:active { transform: scale(0.96); }
.cat-btn .cat-icon { font-size: 28px; display: block; margin-bottom: 4px; }
.cat-btn .cat-name { font-size: 13px; font-weight: 600; }
.cat-btn .cat-count { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; }
.cat-btn.selected {
  background: rgba(255, 159, 10, 0.25);
  border: 1.5px solid rgba(255, 159, 10, 0.5);
  box-shadow: 0 0 20px rgba(255, 159, 10, 0.1);
}
.cat-btn.selected::after { content: '\2713'; position: absolute; top: 6px; right: 8px; font-size: 12px; color: #ff9f0a; }
.start-btn {
  width: 100%; border: none; outline: none; cursor: pointer; font-family: inherit;
  font-size: 17px; font-weight: 700; padding: 16px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(255,159,10,0.9), rgba(240,145,5,0.9));
  color: #fff; box-shadow: 0 4px 20px rgba(255, 159, 10, 0.3);
  transition: all 0.2s; letter-spacing: 0.3px;
}
.start-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 159, 10, 0.4); }
.start-btn:active { transform: scale(0.97); }
.start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.quiz-counter { font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.6); }
.quiz-score { font-size: 14px; font-weight: 600; color: rgba(255, 159, 10, 0.8); }
.quiz-score span { color: #ff9f0a; }
.quiz-streak { font-size: 12px; font-weight: 600; color: rgba(255, 159, 10, 0.5); text-align: center; min-height: 18px; transition: all 0.3s; }
.quiz-streak.active { color: #ff9f0a; }
.progress-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #ff9f0a, #ffb84d); border-radius: 2px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }
.timer-container { display: flex; align-items: center; justify-content: center; margin-bottom: 16px; position: relative; }
.timer-ring { position: relative; width: 56px; height: 56px; }
.timer-ring svg { transform: rotate(-90deg); }
.timer-ring .bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 4; }
.timer-ring .progress { fill: none; stroke: #ff9f0a; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear, stroke 0.3s; }
.timer-ring .progress.warning { stroke: #febc2e; }
.timer-ring .progress.danger { stroke: #ff5f57; }
.timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.7); }
.timer-text.warning { color: #febc2e; }
.timer-text.danger { color: #ff5f57; }
.question-area { position: relative; min-height: 80px; margin-bottom: 16px; }
.question-text { font-size: 20px; font-weight: 500; color: #fff; line-height: 1.4; transition: opacity 0.2s, transform 0.2s; }
.question-text.slide-out { opacity: 0; transform: translateX(-20px); }
.question-text.slide-in { animation: slideIn 0.35s ease forwards; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.question-category { font-size: 11px; font-weight: 600; color: rgba(255, 159, 10, 0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.answers { display: flex; flex-direction: column; gap: 8px; }
.answer-btn {
  border: none; outline: none; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 500; padding: 14px 18px; border-radius: 12px;
  background: rgba(55, 55, 75, 0.45); color: rgba(255, 255, 255, 0.85);
  text-align: left; transition: all 0.15s ease; position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 12px;
}
.answer-btn .letter {
  width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.06);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, 0.4); flex-shrink: 0;
  transition: all 0.2s;
}
.answer-btn:hover { background: rgba(75, 75, 100, 0.6); transform: translateX(3px); }
.answer-btn:hover .letter { background: rgba(255, 159, 10, 0.2); color: #ff9f0a; }
.answer-btn:active { transform: scale(0.98); }
.answer-btn.correct { background: rgba(40, 200, 64, 0.25) !important; border: 1.5px solid rgba(40, 200, 64, 0.5); box-shadow: 0 0 20px rgba(40, 200, 64, 0.1); }
.answer-btn.correct .letter { background: rgba(40, 200, 64, 0.3); color: #28c840; }
.answer-btn.wrong { background: rgba(255, 95, 87, 0.25) !important; border: 1.5px solid rgba(255, 95, 87, 0.5); box-shadow: 0 0 20px rgba(255, 95, 87, 0.1); }
.answer-btn.wrong .letter { background: rgba(255, 95, 87, 0.3); color: #ff5f57; }
.answer-btn.reveal { background: rgba(40, 200, 64, 0.15); border: 1.5px solid rgba(40, 200, 64, 0.3); }
.answer-btn.disabled { cursor: default; pointer-events: none; }
.results-header { text-align: center; margin-bottom: 8px; }
.results-score-ring { position: relative; width: 120px; height: 120px; margin: 0 auto 12px; }
.results-score-ring svg { transform: rotate(-90deg); }
.results-score-ring .bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 6; }
.results-score-ring .progress { fill: none; stroke: #ff9f0a; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
.results-score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.results-score-text .num { font-size: 36px; font-weight: 700; color: #fff; display: block; line-height: 1; }
.results-score-text .label { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 500; }
.results-stars { font-size: 32px; letter-spacing: 4px; margin-bottom: 16px; text-align: center; min-height: 40px; }
.results-stars .star { display: inline-block; opacity: 0; transform: scale(0); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.results-stars .star.show { opacity: 1; transform: scale(1); }
.results-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.stat-card { text-align: center; padding: 14px 8px; border-radius: 12px; background: rgba(55, 55, 75, 0.3); }
.stat-card .value { font-size: 22px; font-weight: 700; color: #fff; }
.stat-card .value.green { color: #28c840; }
.stat-card .value.red { color: #ff5f57; }
.stat-card .value.orange { color: #ff9f0a; }
.stat-card .label { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 2px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
.results-msg { text-align: center; font-size: 15px; color: rgba(255,255,255,0.5); margin-bottom: 20px; font-weight: 400; min-height: 22px; }
.results-actions { display: flex; gap: 10px; }
.results-actions button { flex: 1; border: none; outline: none; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; padding: 14px; border-radius: 12px; transition: all 0.2s; }
.btn-retry { background: rgba(255, 159, 10, 0.9); color: #fff; box-shadow: 0 4px 16px rgba(255, 159, 10, 0.25); }
.btn-retry:hover { transform: translateY(-1px); }
.btn-retry:active { transform: scale(0.97); }
.btn-home { background: rgba(55, 55, 75, 0.5); color: rgba(255,255,255,0.7); }
.btn-home:hover { background: rgba(75, 75, 100, 0.6); }
.btn-home:active { transform: scale(0.97); }
.flash-overlay { position: absolute; inset: 0; border-radius: 28px; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
.flash-overlay.show { opacity: 1; }
.flash-overlay.correct { background: rgba(40, 200, 64, 0.06); }
.flash-overlay.wrong { background: rgba(255, 95, 87, 0.06); }
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; overflow: hidden; }
.confetti-piece { position: absolute; width: 10px; height: 10px; top: -20px; animation: confettiFall 3s ease-in forwards; }
@keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg) scale(0.3); opacity: 0; } }
@media (max-width: 400px) {
  .container { padding: 20px; }
  .category-grid { gap: 8px; }
  .cat-btn { padding: 12px 8px; }
  .cat-btn .cat-icon { font-size: 22px; }
  .question-text { font-size: 17px; }
  .answer-btn { font-size: 14px; padding: 12px 14px; }
  .results-stats { gap: 6px; }
  .stat-card { padding: 10px 4px; }
  .stat-card .value { font-size: 18px; }
}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="flash-overlay" id="flashOverlay"></div>

  <div class="screen active" id="welcomeScreen">
    <div class="welcome-header">
      <div class="logo">🧠</div>
      <h1>QuizMaster</h1>
      <p>Challenge yourself across multiple categories</p>
    </div>
    <div class="category-grid" id="categoryGrid"></div>
    <button class="start-btn" id="startBtn" disabled>Select a Category to Start</button>
  </div>

  <div class="screen" id="quizScreen">
    <div class="quiz-header">
      <div class="quiz-counter" id="quizCounter">Question 1 of 8</div>
      <div class="quiz-score">⭐ <span id="scoreDisplay">0</span></div>
    </div>
    <div class="quiz-streak" id="streakDisplay"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="timer-container">
      <div class="timer-ring">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle class="bg" cx="28" cy="28" r="22"/>
          <circle class="progress" id="timerRing" cx="28" cy="28" r="22" stroke-dasharray="138.23" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-text" id="timerText">15</div>
      </div>
    </div>
    <div class="question-area">
      <div class="question-category" id="qCategory"></div>
      <div class="question-text" id="questionText"></div>
    </div>
    <div class="answers" id="answersContainer"></div>
  </div>

  <div class="screen" id="resultsScreen">
    <div class="results-header">
      <div class="results-score-ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="bg" cx="60" cy="60" r="48"/>
          <circle class="progress" id="resultsRing" cx="60" cy="60" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"/>
        </svg>
        <div class="results-score-text">
          <span class="num" id="resultsScore">0</span>
          <span class="label">points</span>
        </div>
      </div>
    </div>
    <div class="results-stars" id="resultsStars"></div>
    <div class="results-stats">
      <div class="stat-card"><div class="value green" id="correctCount">0</div><div class="label">Correct</div></div>
      <div class="stat-card"><div class="value red" id="wrongCount">0</div><div class="label">Wrong</div></div>
      <div class="stat-card"><div class="value orange" id="accuracyStat">0%</div><div class="label">Accuracy</div></div>
    </div>
    <div class="results-msg" id="resultsMsg"></div>
    <div class="results-actions">
      <button class="btn-home" id="homeBtn">🏠 Home</button>
      <button class="btn-retry" id="retryBtn">🔄 Play Again</button>
    </div>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script src="quiz_app.js"></script>
</body>
</html>
