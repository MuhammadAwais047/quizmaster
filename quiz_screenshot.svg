<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2d2d3f"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30,30,46,0.72)"/>
      <stop offset="100%" stop-color="rgba(30,30,46,0.78)"/>
    </linearGradient>
    <linearGradient id="btnAns" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(55,55,75,0.45)"/>
      <stop offset="100%" stop-color="rgba(50,50,70,0.45)"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="560" fill="url(#bg)" rx="0"/>

  <!-- Container Window -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="400" height="520" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="20" y="20" width="400" height="520" rx="28" fill="url(#glass)"/>
    <rect x="20" y="20" width="400" height="520" rx="28" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>

  <!-- Header -->
  <text x="220" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.3">🧠 QuizMaster</text>

  <!-- Quiz Stats Bar -->
  <rect x="40" y="76" width="360" height="30" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="56" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.55)">Question 3 of 8</text>
  <text x="380" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,159,10,0.8)" text-anchor="end">⭐ <tspan fill="#ff9f0a">28</tspan></text>

  <!-- Streak badge -->
  <rect x="172" y="81" width="96" height="20" rx="10" fill="rgba(255,159,10,0.12)"/>
  <text x="220" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ff9f0a" text-anchor="middle">🔥 3 streak!</text>

  <!-- Progress Bar -->
  <rect x="40" y="114" width="360" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="40" y="114" width="135" height="4" rx="2" fill="url(#progressGrad)"/>

  <!-- Timer Ring -->
  <g transform="translate(192, 160)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
    <circle cx="28" cy="28" r="22" fill="none" stroke="#febc2e" stroke-width="4" stroke-linecap="round" stroke-dasharray="138.23" stroke-dashoffset="50"/>
    <text x="28" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#febc2e" text-anchor="middle">7</text>
  </g>

  <!-- Category -->
  <text x="40" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="rgba(255,159,10,0.5)" letter-spacing="1">🌍 General Knowledge</text>

  <!-- Question -->
  <text x="40" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#fff">What is the capital of</text>
  <text x="40" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#fff">Australia?</text>

  <!-- Answers -->
  <g>
    <!-- A -->
    <rect x="40" y="288" width="360" height="46" rx="12" fill="url(#btnAns)" filter="url(#btnShadow)"/>
    <circle cx="60" cy="311" r="14" fill="rgba(255,255,255,0.06)"/>
    <text x="60" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.4)" text-anchor="middle">A</text>
    <text x="86" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.85)">Sydney</text>

    <!-- B - correct (highlighted green) -->
    <rect x="40" y="342" width="360" height="46" rx="12" fill="rgba(40,200,64,0.25)" filter="url(#btnShadow)" stroke="rgba(40,200,64,0.5)" stroke-width="1.5"/>
    <circle cx="60" cy="365" r="14" fill="rgba(40,200,64,0.3)"/>
    <text x="60" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#28c840" text-anchor="middle">B</text>
    <text x="86" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.95)">Canberra</text>
    <text x="380" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="end">✓</text>

    <!-- C -->
    <rect x="40" y="396" width="360" height="46" rx="12" fill="url(#btnAns)" filter="url(#btnShadow)"/>
    <circle cx="60" cy="419" r="14" fill="rgba(255,255,255,0.06)"/>
    <text x="60" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.4)" text-anchor="middle">C</text>
    <text x="86" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.85)">Melbourne</text>

    <!-- D -->
    <rect x="40" y="450" width="360" height="46" rx="12" fill="url(#btnAns)" filter="url(#btnShadow)"/>
    <circle cx="60" cy="473" r="14" fill="rgba(255,255,255,0.06)"/>
    <text x="60" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.4)" text-anchor="middle">D</text>
    <text x="86" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.85)">Perth</text>
  </g>

  <!-- Glass reflection -->
  <rect x="22" y="22" width="396" height="110" rx="26" fill="url(#glass)" opacity="0.06"/>
</svg>
