<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2d2d3f"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30,30,46,0.72)"/>
      <stop offset="100%" stop-color="rgba(30,30,46,0.78)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="500" fill="url(#bg)" rx="0"/>

  <!-- Container Window -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="400" height="460" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="20" y="20" width="400" height="460" rx="28" fill="url(#glass)"/>
    <rect x="20" y="20" width="400" height="460" rx="28" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>

  <!-- Score Ring -->
  <g transform="translate(160, 80)">
    <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="#ff9f0a" stroke-width="6" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="45"/>
    <text x="60" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">72</text>
    <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle">points</text>
  </g>

  <!-- Stars -->
  <text x="220" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="36" text-anchor="middle">⭐⭐⭐</text>

  <!-- Stats -->
  <g>
    <rect x="45" y="220" width="100" height="56" rx="12" fill="rgba(55,55,75,0.3)"/>
    <text x="95" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#28c840" text-anchor="middle">6</text>
    <text x="95" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="0.5">CORRECT</text>

    <rect x="170" y="220" width="100" height="56" rx="12" fill="rgba(55,55,75,0.3)"/>
    <text x="220" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ff5f57" text-anchor="middle">2</text>
    <text x="220" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="0.5">WRONG</text>

    <rect x="295" y="220" width="100" height="56" rx="12" fill="rgba(55,55,75,0.3)"/>
    <text x="345" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ff9f0a" text-anchor="middle">75%</text>
    <text x="345" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="0.5">ACCURACY</text>
  </g>

  <!-- Message -->
  <text x="220" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle">👏 Great job! Almost perfect!</text>

  <!-- Buttons -->
  <g>
    <rect x="40" y="340" width="180" height="50" rx="12" fill="rgba(55,55,75,0.5)"/>
    <text x="130" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">🏠 Home</text>

    <rect x="230" y="340" width="170" height="50" rx="12" fill="rgba(255,159,10,0.9)" filter="url(#shadow)"/>
    <text x="315" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">🔄 Play Again</text>
  </g>

  <!-- Confetti pieces -->
  <circle cx="40" cy="420" r="5" fill="#ff9f0a" opacity="0.6"/>
  <circle cx="80" cy="450" r="4" fill="#ff5f57" opacity="0.5"/>
  <circle cx="120" cy="430" r="6" fill="#28c840" opacity="0.4"/>
  <circle cx="160" cy="460" r="3" fill="#5e9cff" opacity="0.6"/>
  <circle cx="200" cy="440" r="5" fill="#febc2e" opacity="0.5"/>
  <circle cx="240" cy="455" r="4" fill="#bf7af0" opacity="0.4"/>
  <circle cx="280" cy="425" r="5" fill="#ff6b9d" opacity="0.6"/>
  <circle cx="320" cy="450" r="3" fill="#ff9f0a" opacity="0.5"/>
  <circle cx="360" cy="435" r="4" fill="#28c840" opacity="0.4"/>
  <circle cx="400" cy="460" r="5" fill="#ff5f57" opacity="0.5"/>

  <rect x="50" y="470" width="6" height="6" rx="1" fill="#ff9f0a" opacity="0.3" transform="rotate(30 53 473)"/>
  <rect x="300" y="475" width="8" height="8" rx="1" fill="#5e9cff" opacity="0.3" transform="rotate(45 304 479)"/>

  <!-- Glass reflection -->
  <rect x="22" y="22" width="396" height="70" rx="26" fill="url(#glass)" opacity="0.06"/>
</svg>
